# Gera o APK arm64 do fork (manual: aba Actions > Build APK > Run workflow).
# Segue o processo documentado em docs/android-publication.md:
# baixa os arquivos oficiais da Mojang (hashes verificados), prepara as tabelas do
# motor e compila o APK no modo --public. Nada da Mojang vai para o Git.
name: Build APK (arm64)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      HORIZON_TELEMETRY_URL: "off"
      CARGO_BUILD_JOBS: "4"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Liberar espaco em disco
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h /

      - name: Dependencias do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"

      - name: Toolchains (Rust e Android)
        run: |
          rustup show
          rustup target add aarch64-linux-android
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "ndk;28.2.13676358" "build-tools;35.0.0" "platforms;android-35"

      - name: Preparar tabelas do motor (baixa os arquivos oficiais da Mojang)
        run: python3 tools/android_prepare.py

      - name: Build do APK
        run: >
          python3 tools/android_build.py --abi arm64-v8a --public
          --sdk "$ANDROID_HOME" --java-home "$JAVA_HOME_17_X64"

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: amethyst-arm64-apk
          path: .local/android/apk/arm64-v8a/horizon-android-public.apk
          retention-days: 3
          if-no-files-found: error
